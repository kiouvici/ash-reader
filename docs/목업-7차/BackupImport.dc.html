<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>백업 가져오기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>body{margin:0} button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; background: #FBF9F5; color: #1F1F1F">
<div style="height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #E5E0D6">
<div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></div>
<div style="font-size: 18px; font-weight: 700">백업 가져오기</div>
</div>
<div style="margin: 16px 16px 0; padding: 12px 14px; border-radius: 12px; background: #F2F5F9; display: flex; align-items: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E4A6B" stroke-width="2" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"></path></svg>
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 12px; color: #5F6368">찾는 폴더</div><div style="font-size: 14px; font-weight: 500">Download/ASH Reader 백업</div></div>
<div style="height: 44px; padding: 0 12px; display: flex; align-items: center; color: #2E4A6B; font-size: 14px; font-weight: 700">폴더 바꾸기</div>
</div>
<div style="padding: 16px 20px 6px; font-size: 13px; color: #2E4A6B; font-weight: 700">이 폴더의 백업 파일 {{count}}개 · 최신 순</div>
<sc-for list="{{files}}" as="f" hint-placeholder-count="3">
<button onClick="{{f.pick}}" style="margin: 0 16px 8px; width: calc(100% - 32px); padding: 14px; border-radius: 14px; background: #FFFFFF; border: {{f.border}}; display: flex; gap: 12px; align-items: center; text-align: left">
<div style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #2E4A6B; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><div style="width: 10px; height: 10px; border-radius: 5px; background: {{f.dot}}"></div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 15px; font-weight: 500">{{f.date}}</div>
<div style="font-size: 12px; color: #5F6368">{{f.what}}</div>
<div style="font-size: 12px; color: #9AA0A6">{{f.file}} · {{f.size}}</div>
</div>
</button>
</sc-for>
<div style="margin: 4px 20px 0; font-size: 12px; line-height: 1.6; color: #5F6368">백업 파일(.ashbak)만 보여요. 다른 파일은 숨겨요.</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; background: #FFFFFF; border-top: 1px solid #E5E0D6">
<div style="display: flex; gap: 8px; margin-bottom: 12px">
<sc-for list="{{ways}}" as="w" hint-placeholder-count="2">
<button onClick="{{w.pick}}" style="flex: 1; min-height: 56px; border-radius: 12px; border: {{w.border}}; background: {{w.bg}}; text-align: left; padding: 8px 12px"><div style="font-size: 14px; font-weight: 700">{{w.name}}</div><div style="font-size: 12px; color: #5F6368">{{w.sub}}</div></button>
</sc-for>
</div>
<div style="height: 52px; border-radius: 26px; background: #2E4A6B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">가져오기</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0, way: 0 }; }
renderVals() {
const s = this.state;
const F = [
['2026년 10월 23일 오후 6:02', '책 128권 · 책갈피 340 · 메모 52', 'ASH-백업-20261023-1802.ashbak', '1.2MB'],
['2026년 10월 20일 오전 9:15', '책 121권 · 책갈피 318 · 메모 47', 'ASH-백업-20261020-0915.ashbak', '1.1MB'],
['2026년 10월 2일 오후 10:40', '책 96권 · 책갈피 251 · 메모 30', 'ASH-백업-20261002-2240.ashbak', '0.9MB']
];
const W = [['합치기', '지금 기록은 두고 더하기'], ['바꾸기', '지금 기록을 백업으로 바꾸기']];
return {
count: F.length,
files: F.map((f, i) => ({ date: f[0], what: f[1], file: f[2], size: f[3], border: i === s.sel ? '2px solid #2E4A6B' : '1px solid #E5E0D6', dot: i === s.sel ? '#2E4A6B' : 'transparent', pick: () => this.setState({ sel: i }) })),
ways: W.map((w, i) => ({ name: w[0], sub: w[1], border: i === s.way ? '2px solid #2E4A6B' : '1px solid #E5E0D6', bg: i === s.way ? '#F2F5F9' : '#FFFFFF', pick: () => this.setState({ way: i }) }))
};
}
}
</script>
</body>
</html>
