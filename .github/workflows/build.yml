name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASH_KEYSTORE_BASE64: ${{ secrets.ASH_KEYSTORE_BASE64 }}
      ASH_KEYSTORE_PASSWORD: ${{ secrets.ASH_KEYSTORE_PASSWORD }}
      ASH_KEY_ALIAS: ${{ secrets.ASH_KEY_ALIAS }}
      ASH_KEY_PASSWORD: ${{ secrets.ASH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        id: signing
        shell: bash
        run: |
          if [ -n "$ASH_KEYSTORE_BASE64" ] && [ -n "$ASH_KEYSTORE_PASSWORD" ] && [ -n "$ASH_KEY_ALIAS" ] && [ -n "$ASH_KEY_PASSWORD" ]; then
            KS="$RUNNER_TEMP/ash-release.jks"
            echo "$ASH_KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "ASH_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "### 릴리스 서명: 릴리스 키 사용" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=릴리스 서명 키 없음::ASH_KEYSTORE_* 시크릿이 없어 release APK를 debug 키로 서명했습니다. 배포용으로 쓰지 마세요."
            {
              echo "### 경고: release APK가 debug 키로 서명됨"
              echo ""
              echo "시크릿 ASH_KEYSTORE_BASE64 / ASH_KEYSTORE_PASSWORD / ASH_KEY_ALIAS / ASH_KEY_PASSWORD 가 설정되지 않았습니다."
              echo "이 APK는 시험용이며, 릴리스 키로 서명한 APK와 덮어 설치되지 않습니다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Permission check (N-05 ①)
        run: ./gradlew --stacktrace :app:checkDebugNoInternetPermission :app:checkReleaseNoInternetPermission

      - name: Unit tests
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Assemble debug & release
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Rename APKs
        shell: bash
        run: |
          mkdir -p dist
          VC="${GITHUB_RUN_NUMBER}"
          SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ash-reader-${VC}-${SHA}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/ash-reader-${VC}-${SHA}-release-${{ steps.signing.outputs.mode }}signed.apk"
          {
            echo ""
            echo "### APK (versionCode ${VC})"
            echo '```'
            (cd dist && sha256sum *.apk)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ash-reader-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ash-release.jks"
