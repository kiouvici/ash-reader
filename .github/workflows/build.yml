# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # :engine-comic 의 ncnn 소스 빌드 결과 위치 (actions/cache 대상, 체크아웃 밖)
  ASH_NCNN_DIR: /home/runner/ncnn-cache

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 외부 액션은 커밋 SHA로 고정 (주석은 해당 태그). 모두 Node 24 런타임.
#   actions/checkout          v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-java        v6.1.0  b843ebf9b913146b38da2eaa7aeddf76074ae1ad
#   android-actions/setup-android v4.0.4 be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
#   gradle/actions/setup-gradle v6.4.0 3f5f9adaf7d9fecd50b5935e54106014257a94e6
#   actions/upload-artifact   v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   reactivecircus/android-emulator-runner v2.38.0 a421e43855164a8197daf9d8d40fe71c6996bb0d
#   actions/download-artifact v7.0.0  37930b1c2abaa49bbe596cd826c3c89aef350131

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"

      # :bench 가 :engine-hwp(rust, cargo-ndk)·:engine-mupdf(NDK)를 쓴다
      - name: Set up Rust + cargo-ndk
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi i686-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # :engine-comic 의 ncnn(소스 빌드, Vulkan 켬) 결과 캐시. 키 = ncnn 태그 + NDK 버전 + ABI
      - name: Cache ncnn build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/ncnn-cache
          key: ncnn-20261020-ndk28.2.13676358-arm64-v8a_x86_64-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # 앱 코드가 컴파일되는지만 먼저 본다. 실패하면 뒤 작업(빌드·권한·넘김 검사)은 돌지 않는다.
      - name: Compile app (Kotlin)
        shell: bash
        run: .github/scripts/gradle-annotate.sh :app:compileDebugKotlin

      # I-606: Room 스키마(app/schemas)는 저장소에 커밋한다. 컴파일(KSP)이 만든 JSON 이 커밋한 것과 다르거나
      # 커밋 안 된 판이 있으면 실패(DB 판을 올릴 때 스키마 파일을 같이 커밋하도록). 파일은 reports 산출물에도 올라간다.
      - name: Room schema committed
        shell: bash
        run: |
          changed="$(git status --porcelain -- app/schemas)"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- app/schemas | head -100
            # 산출물을 내려받을 수 없는 환경용: 바뀐/새 스키마 파일을 gzip+base64 로 알림(annotation)에 싣는다(REST check-runs 로 읽음)
            git ls-files --others --modified -- app/schemas | while read -r f; do
              gzip -9c "$f" | base64 -w0 | fold -w 60000 | nl -ba -w1 -s' ' | while read -r n chunk; do
                echo "::notice title=ROOM_SCHEMA $f #$n::$chunk"
              done
            done
            echo "::error title=Room schema::app/schemas 가 커밋된 것과 달라요. 빌드가 만든 스키마 JSON 을 커밋하세요(reports 산출물의 app/schemas)."
            exit 1
          fi

      # 필수 1: minSdk 26 보다 새 API(NewApi)를 쓰면 실패. app·엔진 모듈 모두 (lint 설정은 각 모듈 build.gradle.kts)
      - name: Lint NewApi (app + engines)
        shell: bash
        run: .github/scripts/gradle-annotate.sh :app:lintDebug :engine-comic:lintDebug :engine-hwp:lintDebug :engine-mupdf:lintDebug :engine-office:lintDebug :engine-convert:lintDebug :engine-djvu:lintDebug :pagecurl:lintDebug

      # C1: 배포 APK 에 들어가는 외부 모듈·라이선스 목록(THIRD_PARTY_NOTICES 갱신 근거). 실패해도 빌드는 계속.
      - name: List third-party Android dependencies
        continue-on-error: true
        run: ./gradlew --console=plain --no-configuration-cache :app:ashThirdPartyDeps

      # 아티팩트·로그를 못 받는 환경에서도 목록을 읽을 수 있게 압축본(tgz, base64)을 주석(annotation)으로 남긴다.
      - name: Third-party list as annotations
        continue-on-error: true
        shell: bash
        run: |
          [ -d app/build/third-party ] || exit 0
          tar -C app/build -czf /tmp/tp.tgz third-party
          python3 - <<'PY'
          import base64
          b = base64.b64encode(open('/tmp/tp.tgz','rb').read()).decode()
          n = 3500; parts = [b[i:i+n] for i in range(0, len(b), n)]
          kinds = ['notice'] * 10 + ['warning'] * 10
          for i, p in enumerate(parts[:20]):
              print('::%s title=ashtp %d/%d::%s' % (kinds[i], i + 1, len(parts), p))
          PY

      - name: Upload third-party list
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-android
          path: app/build/third-party/
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"

      # :bench 가 :engine-hwp(rust, cargo-ndk)·:engine-mupdf(NDK)를 쓴다
      - name: Set up Rust + cargo-ndk
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi i686-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # :engine-comic 의 ncnn(소스 빌드, Vulkan 켬) 결과 캐시. 키 = ncnn 태그 + NDK 버전 + ABI
      - name: Cache ncnn build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/ncnn-cache
          key: ncnn-20261020-ndk28.2.13676358-arm64-v8a_x86_64-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # P4/P9: 시크릿은 이 단계와 빌드 단계에만 노출한다.
      # release = ASH_KEYSTORE_BASE64/ASH_KEYSTORE_PASSWORD/ASH_KEY_ALIAS/ASH_KEY_PASSWORD
      # debug   = ASH_DEBUG_KEYSTORE_BASE64/ASH_DEBUG_KEYSTORE_PASSWORD/ASH_DEBUG_KEY_ALIAS (키 비밀번호 = 저장소 비밀번호)
      # main·태그: 두 키 중 하나라도 없으면 실패. 그 밖의 브랜치: 경고 후 AGP 기본 debug 키로 대체.
      - name: Prepare signing keys
        id: signing
        shell: bash
        env:
          ASH_KEYSTORE_BASE64: ${{ secrets.ASH_KEYSTORE_BASE64 }}
          ASH_KEYSTORE_PASSWORD: ${{ secrets.ASH_KEYSTORE_PASSWORD }}
          ASH_KEY_ALIAS: ${{ secrets.ASH_KEY_ALIAS }}
          ASH_KEY_PASSWORD: ${{ secrets.ASH_KEY_PASSWORD }}
          ASH_DEBUG_KEYSTORE_BASE64: ${{ secrets.ASH_DEBUG_KEYSTORE_BASE64 }}
          ASH_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ASH_DEBUG_KEYSTORE_PASSWORD }}
          ASH_DEBUG_KEY_ALIAS: ${{ secrets.ASH_DEBUG_KEY_ALIAS }}
          IS_PROTECTED_REF: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          missing=()
          if [ -n "$ASH_KEYSTORE_BASE64" ] && [ -n "$ASH_KEYSTORE_PASSWORD" ] && [ -n "$ASH_KEY_ALIAS" ] && [ -n "$ASH_KEY_PASSWORD" ]; then
            KS="$RUNNER_TEMP/ash-release.jks"
            printf '%s' "$ASH_KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "release_keystore=$KS" >> "$GITHUB_OUTPUT"
            echo "release_mode=release" >> "$GITHUB_OUTPUT"
            echo "- release: 릴리스 키 (ASH_KEY*)" >> "$GITHUB_STEP_SUMMARY"
          else
            missing+=("release(ASH_KEYSTORE_BASE64/ASH_KEYSTORE_PASSWORD/ASH_KEY_ALIAS/ASH_KEY_PASSWORD)")
            echo "release_keystore=" >> "$GITHUB_OUTPUT"
            echo "release_mode=fallback" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ASH_DEBUG_KEYSTORE_BASE64" ] && [ -n "$ASH_DEBUG_KEYSTORE_PASSWORD" ] && [ -n "$ASH_DEBUG_KEY_ALIAS" ]; then
            KS="$RUNNER_TEMP/ash-debug.jks"
            printf '%s' "$ASH_DEBUG_KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "debug_keystore=$KS" >> "$GITHUB_OUTPUT"
            echo "debug_mode=fixed" >> "$GITHUB_OUTPUT"
            echo "- debug: 고정 디버그 키 (ASH_DEBUG_*)" >> "$GITHUB_STEP_SUMMARY"
          else
            missing+=("debug(ASH_DEBUG_KEYSTORE_BASE64/ASH_DEBUG_KEYSTORE_PASSWORD/ASH_DEBUG_KEY_ALIAS)")
            echo "debug_keystore=" >> "$GITHUB_OUTPUT"
            echo "debug_mode=fallback" >> "$GITHUB_OUTPUT"
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$IS_PROTECTED_REF" = "true" ]; then
              echo "::error title=서명 키 없음::main 브랜치·태그 빌드에 필요한 시크릿이 없습니다: ${missing[*]}"
              echo "### 실패: main·태그 빌드인데 서명 키 시크릿이 없습니다: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning title=서명 키 없음::시크릿이 없어 AGP 기본 debug 키로 대체 서명했습니다: ${missing[*]}. 배포용으로 쓰지 마세요."
            {
              echo ""
              echo "### 경고: 일부 APK가 AGP 기본 debug 키로 서명됨"
              echo "없는 시크릿: ${missing[*]}"
              echo "이 APK는 시험용이며, 정식 키로 서명한 APK와 덮어 설치되지 않습니다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Permission check, merged manifest (N-05 ①)
        shell: bash
        run: .github/scripts/gradle-annotate.sh :app:checkDebugNoInternetPermission :app:checkReleaseNoInternetPermission :bench:checkDebugNoInternetPermission :bench:checkReleaseNoInternetPermission

      - name: Unit tests
        shell: bash
        run: .github/scripts/gradle-annotate.sh :app:testDebugUnitTest :engine-office:testDebugUnitTest :bench:testDebugUnitTest :pagecurl:testDebugUnitTest :engine-comic:testDebugUnitTest :engine-convert:testDebugUnitTest

      - name: Assemble debug & release (app, bench)
        shell: bash
        env:
          ASH_KEYSTORE_FILE: ${{ steps.signing.outputs.release_keystore }}
          ASH_KEYSTORE_PASSWORD: ${{ secrets.ASH_KEYSTORE_PASSWORD }}
          ASH_KEY_ALIAS: ${{ secrets.ASH_KEY_ALIAS }}
          ASH_KEY_PASSWORD: ${{ secrets.ASH_KEY_PASSWORD }}
          ASH_DEBUG_KEYSTORE_FILE: ${{ steps.signing.outputs.debug_keystore }}
          ASH_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ASH_DEBUG_KEYSTORE_PASSWORD }}
          ASH_DEBUG_KEY_ALIAS: ${{ secrets.ASH_DEBUG_KEY_ALIAS }}
        run: .github/scripts/gradle-annotate.sh :app:assembleDebug :app:assembleRelease :bench:assembleDebug :bench:assembleRelease

      # 실험 ⑤: 칸 인식 합성 시험 결과와 libash_comic.so 크기·16KB 정렬 (arm64·x86_64 필수)
      - name: Comic engine report (.so size, 16KB alignment, panel test)
        shell: bash
        run: |
          set -euo pipefail
          OBJDUMP="$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          APK=bench/build/outputs/apk/release/bench-release.apk
          rm -rf so && mkdir so && unzip -q -o "$APK" 'lib/*' -d so
          {
            echo "### 실험 ⑤ :engine-comic"
            R=$(ls engine-comic/build/test-results/testDebugUnitTest/*PanelDetectorTest*.xml)
            echo '```'; grep -o 'ASH-PANEL total[^<]*' "$R" || true; echo '```'
            echo "| ABI | .so | 크기(바이트) | APK 안 압축 크기 | LOAD 정렬 |"; echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for so in so/lib/*/*.so; do
            abi=$(basename "$(dirname "$so")"); n=$(basename "$so")
            sz=$(stat -c %s "$so"); csz=$(unzip -v "$APK" "lib/$abi/$n" | awk 'NR==4{print $3}')
            al=$("$OBJDUMP" -p "$so" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
            ok=yes; for a in $al; do [ "$a" = "2**14" ] || [ "$a" = "2**16" ] || ok=no; done
            [ "$ok" = no ] && fail=1
            echo "| $abi | $n | $sz | $csz | $al ($ok) |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=.so $abi::$n $sz B, APK 압축 $csz B, LOAD $al ($ok)"
          done
          A=$(unzip -l "$APK" 'assets/realcugan/*' | tail -1 | awk '{print $1}')
          echo "- Real-CUGAN 모델 assets 합계: $A 바이트" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Real-CUGAN assets::$A B"
          [ "$fail" = 0 ] || { echo "::error title=16KB 정렬::64비트 .so LOAD 정렬이 16KB가 아닙니다"; exit 1; }

      # 앱 APK(배포본)의 모든 64비트 .so 도 16KB 정렬이어야 한다 + zip 정렬(zipalign -P 16)
      - name: App APK 16KB alignment
        shell: bash
        run: |
          set -euo pipefail
          OBJDUMP="$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          ZIPALIGN="$(ls -1d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)"
          fail=0
          echo "### 앱 APK 16KB 정렬" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | ABI | .so | LOAD 정렬 |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for APK in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            rm -rf so-app && mkdir so-app && unzip -q -o "$APK" 'lib/*' -d so-app || true
            for so in so-app/lib/arm64-v8a/*.so so-app/lib/x86_64/*.so; do
              [ -f "$so" ] || continue
              abi=$(basename "$(dirname "$so")"); n=$(basename "$so")
              al=$("$OBJDUMP" -p "$so" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
              ok=yes; for a in $al; do [ "$a" = "2**14" ] || [ "$a" = "2**16" ] || ok=no; done
              [ "$ok" = no ] && fail=1
              echo "| $(basename "$APK") | $abi | $n | $al ($ok) |" >> "$GITHUB_STEP_SUMMARY"
              # 배치 간 크기 비교용: 배포 APK(release) arm64 .so 의 APK 안 크기를 주석으로
              case "$APK" in *release*) [ "$abi" = arm64-v8a ] && echo "::notice title=앱 .so arm64::$n $(unzip -v "$APK" "lib/$abi/$n" | awk 'NR==4{print $3}') B (APK 안), LOAD $al ($ok)";; esac
            done
            if "$ZIPALIGN" -c -P 16 -v 4 "$APK" > /tmp/za.txt 2>&1; then
              echo "- $(basename "$APK"): zipalign -P 16 통과" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $(basename "$APK"): zipalign -P 16 실패" >> "$GITHUB_STEP_SUMMARY"; grep -i "bad\|BAD" /tmp/za.txt | head -5 || true; fail=1
            fi
          done
          [ "$fail" = 0 ] || { echo "::error title=앱 APK 16KB 정렬::앱 APK 의 64비트 .so 또는 zip 정렬이 16KB가 아닙니다"; exit 1; }

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ash-release.jks" "$RUNNER_TEMP/ash-debug.jks"

      - name: Permission check, final APK (aapt2)
        shell: bash
        run: .github/scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk bench/build/outputs/apk/debug/bench-debug.apk bench/build/outputs/apk/release/bench-release.apk

      # P4: 서명 인증서 지문 확인. release는 기대 지문과 다르면 실패, debug는 지문을 요약에 표시.
      - name: Verify signing certificates
        shell: bash
        env:
          EXPECTED_RELEASE_SHA256: "AE:6D:B1:29:FB:E2:1E:5B:F4:AA:56:41:55:BC:7C:4B:53:D1:F9:43:AA:86:50:D0:79:0A:E3:4D:2A:25:B6:F1"
          RELEASE_MODE: ${{ steps.signing.outputs.release_mode }}
          DEBUG_MODE: ${{ steps.signing.outputs.debug_mode }}
        run: .github/scripts/verify-apk-signers.sh app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk

      # 측정 앱(bench)은 release·debug 모두 고정 디버그 키로 서명돼야 한다 (app-debug 와 같은 지문).
      - name: Verify bench signing (debug key)
        shell: bash
        env:
          DEBUG_MODE: ${{ steps.signing.outputs.debug_mode }}
        run: |
          APKSIGNER="$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          fp() { "$APKSIGNER" verify --print-certs "$1" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*digest: //'; }
          REF="$(fp app/build/outputs/apk/debug/app-debug.apk)"
          fail=0
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 측정 앱 서명" >> "$GITHUB_STEP_SUMMARY"
          for apk in bench/build/outputs/apk/debug/bench-debug.apk bench/build/outputs/apk/release/bench-release.apk; do
            F="$(fp "$apk")"
            echo "- $(basename "$apk"): \`$F\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DEBUG_MODE" = "fixed" ] && [ "$F" != "$REF" ]; then
              echo "::error title=측정 앱 서명 오류::$(basename "$apk") 가 고정 디버그 키로 서명되지 않았습니다 ($F)"
              fail=1
            fi
          done
          exit $fail

      # P5: 릴리스 APK와 같은 커밋의 소스(source.zip)를 함께 올린다 (AGPL-3.0 소스 제공).
      - name: Package APKs and source
        shell: bash
        env:
          RELEASE_MODE: ${{ steps.signing.outputs.release_mode }}
          DEBUG_MODE: ${{ steps.signing.outputs.debug_mode }}
        run: |
          mkdir -p dist
          VC=$((1000 + GITHUB_RUN_NUMBER))
          SHA="${GITHUB_SHA::7}"
          RS=""; DS=""
          [ "$RELEASE_MODE" = "fallback" ] && RS="-debugsigned"
          [ "$DEBUG_MODE" = "fallback" ] && DS="-agpkey"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ash-reader-${VC}-${SHA}-debug${DS}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/ash-reader-${VC}-${SHA}-release${RS}.apk"
          git archive --format=zip --prefix="ash-reader-${SHA}/" -o "dist/ash-reader-${VC}-${SHA}-source.zip" "$GITHUB_SHA"
          # 측정 앱: 별도 artifact (같은 커밋 소스 포함)
          mkdir -p dist-bench
          cp bench/build/outputs/apk/release/bench-release.apk "dist-bench/ash-reader-bench-${VC}-${SHA}-release${DS}.apk"
          cp bench/build/outputs/apk/debug/bench-debug.apk "dist-bench/ash-reader-bench-${VC}-${SHA}-debug${DS}.apk"
          cp "dist/ash-reader-${VC}-${SHA}-source.zip" dist-bench/
          # APK 크기(바이트)를 주석으로 남긴다(배치 간 비교용)
          for f in dist/*.apk; do echo "::notice title=APK 크기::$(basename "$f") $(stat -c%s "$f") B"; done
          {
            echo ""
            echo "### 산출물 (versionCode ${VC}, 커밋 ${GITHUB_SHA})"
            echo '```'
            (cd dist && sha256sum *)
            (cd dist-bench && sha256sum *.apk)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs and source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-reader-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # GPL §3·AGPL §6 대응 소스: 빌드에 쓴 서드파티 소스(받아 온 그대로 + ASH 패치 적용본)를 따로 묶는다.
      # source.zip(저장소)에는 서드파티가 없으므로 이 묶음과 함께 주면 '대응 소스 전체'가 된다(docs/01-기술설계서.md 라이선스 절).
      - name: Package third-party sources
        shell: bash
        run: |
          VC=$((1000 + GITHUB_RUN_NUMBER)); SHA="${GITHUB_SHA::7}"
          T="third-party-src"; rm -rf "$T" dist-3p && mkdir -p "$T" dist-3p
          add() { [ -e "$1" ] && { mkdir -p "$T/$2"; cp -a "$1/." "$T/$2/"; } || echo "::warning title=서드파티 소스 없음::$1"; }
          add engine-mupdf/build/mupdf-src mupdf
          add engine-hwp/build/rhwp rhwp
          add engine-comic/build/third_party/libarchive libarchive
          add engine-comic/build/third_party/dl comic-downloads
          add /home/runner/ncnn-cache/src-20261020 ncnn
          add engine-convert/build/third_party/libmobi libmobi
          add engine-convert/build/third_party/libmspack libmspack
          add engine-djvu/build/third_party/djvulibre djvulibre
          # rhwp·resvg 등 Rust 의존 크레이트 소스(Cargo.lock 고정판)
          mkdir -p "$T/cargo-vendor"
          (cd engine-hwp/rust && cargo vendor --locked "$GITHUB_WORKSPACE/$T/cargo-vendor" > /dev/null) || echo "::warning title=cargo vendor 실패::Rust 크레이트 소스를 넣지 못했습니다"
          # 받은 압축본(모델·프리빌드)은 소스가 아니므로 뺀다
          find "$T" -name .git -prune -exec rm -rf {} + || true
          find "$T/comic-downloads" -type f ! -iname '*LICENSE*' ! -iname '*.tar.*' -delete 2>/dev/null || true
          {
            echo "ASH Reader ${VC} (${GITHUB_SHA}) 서드파티 대응 소스"
            echo "앱 소스: ash-reader-${VC}-${SHA}-source.zip (같은 실행의 ash-reader-${{ github.run_number }} 산출물)"
            echo "각 폴더는 빌드 스크립트(engine-*/scripts)가 받아 SHA 를 확인한 그대로이며, mupdf 는 engine-mupdf/patches 를 적용한 상태입니다."
          } > "$T/README.txt"
          tar -czf "dist-3p/ash-reader-${VC}-${SHA}-third-party-sources.tar.gz" "$T"
          echo "::notice title=서드파티 소스::$(stat -c%s dist-3p/*.tar.gz) B"

      - name: Upload third-party sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-sources-${{ github.run_number }}
          path: dist-3p/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload bench APKs and source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-reader-bench-${{ github.run_number }}
          path: dist-bench/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
            app/schemas/
            engine-office/build/reports/
            engine-office/build/test-results/
            bench/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  # 실험 ②: POI(poi + poi-scratchpad)를 넣었을 때 R8 후 release APK 증가량 측정. 서명은 AGP 기본 debug 키(크기만 봄).
  # office-apk-size(실험 ②) 제거: 2단계부터 :engine-office 가 앱에 항상 들어가므로 비교 대상이 없음

  # P8: 음성 시험. INTERNET 권한을 넣은 시험용 빌드에서 두 검사가 모두 '실패'해야 이 job이 성공한다.
  permission-negative-test:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"

      # :bench 가 :engine-hwp(rust, cargo-ndk)·:engine-mupdf(NDK)를 쓴다
      - name: Set up Rust + cargo-ndk
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi i686-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # :engine-comic 의 ncnn(소스 빌드, Vulkan 켬) 결과 캐시. 키 = ncnn 태그 + NDK 버전 + ABI
      - name: Cache ncnn build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/ncnn-cache
          key: ncnn-20261020-ndk28.2.13676358-arm64-v8a_x86_64-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Merged-manifest check must fail
        shell: bash
        run: |
          set -o pipefail
          if ./gradlew --console=plain -Pash.negativeTest=true :app:assembleNegativeProbe 2>&1 | tee neg1.log; then
            echo "::error title=음성 시험 실패::INTERNET 권한이 있는데 병합 매니페스트 검사가 빌드를 막지 못했습니다"
            exit 1
          fi
          if ! grep -q "N-05 위반 \[negativeProbe\]" neg1.log; then
            echo "::error title=음성 시험 판정 불가::빌드는 실패했지만 N-05 검사 때문이 아닙니다"
            grep -E "What went wrong|^> |^e: " neg1.log | head -20
            exit 1
          fi
          echo "기대대로 실패: 병합 매니페스트 검사가 INTERNET 권한을 잡았습니다" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Final-APK (aapt2) check must fail
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain -Pash.negativeTest=true :app:assembleNegativeProbe -x :app:checkNegativeProbeNoInternetPermission
          APK=$(ls app/build/outputs/apk/negativeProbe/*.apk | head -1)
          if .github/scripts/check-apk-permissions.sh "$APK" > neg2.log 2>&1; then
            cat neg2.log
            echo "::error title=음성 시험 실패::INTERNET 권한이 있는 APK를 aapt2 검사가 통과시켰습니다"
            exit 1
          fi
          grep -q "android.permission.INTERNET" neg2.log || { cat neg2.log; echo "::error::aapt2 검사 실패 원인이 INTERNET이 아닙니다"; exit 1; }
          echo "기대대로 실패: aapt2 최종 APK 검사가 INTERNET 권한을 잡았습니다" | tee -a "$GITHUB_STEP_SUMMARY"

  # 실험 ③: 에뮬레이터에서 넘김 표면 스모크 시험 (성능 판정 아님, 동작 확인만)
  pagecurl-smoke:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "::notice title=KVM::사용 가능 ($(nproc) cores)"; else echo "::warning title=KVM::/dev/kvm 없음 또는 권한 없음"; ls -l /dev/kvm || true; fi

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"

      # :bench 가 :engine-hwp(rust, cargo-ndk)·:engine-mupdf(NDK)를 쓴다
      - name: Set up Rust + cargo-ndk
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi i686-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # :engine-comic 의 ncnn(소스 빌드, Vulkan 켬) 결과 캐시. 키 = ncnn 태그 + NDK 버전 + ABI
      - name: Cache ncnn build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/ncnn-cache
          key: ncnn-20261020-ndk28.2.13676358-arm64-v8a_x86_64-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build test APKs
        shell: bash
        run: .github/scripts/gradle-annotate.sh :bench:assembleDebug :bench:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Emulator smoke test
        id: smoke1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 1200
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: ./gradlew --console=plain :bench:connectedDebugAndroidTest :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notPackage=kr.vici.ashreader.e2e

      # 러너(2코어)에서 에뮬레이터 부팅이 가끔 시간 초과 → 1회만 재시도
      - name: Emulator smoke test (retry)
        if: steps.smoke1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 1200
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: ./gradlew --console=plain :bench:connectedDebugAndroidTest :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notPackage=kr.vici.ashreader.e2e

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pagecurl-smoke-${{ github.run_number }}
          path: |
            bench/build/reports/androidTests/
            app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

  # ───────────── 7D 종단(E2E) UI 시험 ─────────────
  # 앱·시험 APK 를 한 번만 빌드해 산출물로 넘기고, 에뮬레이터 job 들(휴대폰·태블릿 가로/세로·API 26)이 나눠 돌린다.
  e2e-apks:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"

      - name: Set up Rust + cargo-ndk
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi i686-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache ncnn build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/ncnn-cache
          key: ncnn-20261020-ndk28.2.13676358-arm64-v8a_x86_64-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Maven Central 429 등 일시 오류: 1분 쉬고 한 번 더
      - name: Build app + E2E test APKs (debug)
        shell: bash
        run: |
          T=":app:assembleDebug :app:assembleDebugAndroidTest"
          .github/scripts/gradle-annotate.sh $T || { echo "::warning title=e2e-apks::빌드 실패 — 60초 뒤 다시 시도"; sleep 60; .github/scripts/gradle-annotate.sh $T; }
          mkdir -p e2e-apks
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk e2e-apks/
          ls -la e2e-apks

      - name: Upload E2E APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-apks-${{ github.run_number }}
          path: e2e-apks/
          retention-days: 3

  e2e:
    needs: e2e-apks
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 결과 브랜치(ci-e2e/<이름>)에 화면·logcat 을 올리기 위한 쓰기 권한(작업 브랜치 push 때만 씀)
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 묶음 a = 첫 실행·서재·모든 형식, b = 읽기·만화·설정·인텐트·복원(+ 프로세스 종료 복원)
          - { name: phone-35-a, api: 35, target: google_apis, profile: pixel_7, ram: 3072M, suite: a, orient: natural }
          - { name: phone-35-b, api: 35, target: google_apis, profile: pixel_7, ram: 3072M, suite: b, orient: natural }
          - { name: phone-36-b, api: 36, target: google_apis, profile: pixel_7, ram: 3072M, suite: b, orient: natural }
          - { name: tablet-35-land-a, api: 35, target: google_apis, profile: pixel_tablet, ram: 4096M, suite: a, orient: landscape }
          - { name: tablet-35-land-b, api: 35, target: google_apis, profile: pixel_tablet, ram: 4096M, suite: b, orient: landscape }
          - { name: tablet-35-port, api: 35, target: google_apis, profile: pixel_tablet, ram: 4096M, suite: portrait, orient: portrait }
          - { name: api26-smoke, api: 26, target: default, profile: pixel_5, ram: 2048M, suite: smoke, orient: natural }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download E2E APKs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-apks-${{ github.run_number }}
          path: apks

      - name: Make synthetic test files
        shell: bash
        run: python3 .github/scripts/make-e2e-files.py e2e-files e2e-files-view

      - name: Run E2E on emulator
        id: run1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          OUT: e2e-out
          APK_DIR: apks
          FILES_DIR: e2e-files
          VIEW_DIR_LOCAL: e2e-files-view
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram }}
          disk-size: 6G
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash .github/scripts/e2e-run.sh ${{ matrix.suite }} ${{ matrix.orient }}

      # 에뮬레이터 부팅 실패(시험 결과가 없음)일 때만 한 번 더. 시험 실패는 다시 돌리지 않는다.
      - name: Run E2E on emulator (retry after boot failure)
        id: run2
        if: steps.run1.outcome == 'failure' && hashFiles('e2e-out/instrument/*.txt') == ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          OUT: e2e-out
          APK_DIR: apks
          FILES_DIR: e2e-files
          VIEW_DIR_LOCAL: e2e-files-view
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram }}
          disk-size: 6G
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash .github/scripts/e2e-run.sh ${{ matrix.suite }} ${{ matrix.orient }}

      - name: Upload E2E screenshots + logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.name }}-${{ github.run_number }}
          path: e2e-out/
          if-no-files-found: warn
          retention-days: 14

      # 산출물(Azure blob)을 내려받을 수 없는 환경용: 줄인 화면·logcat(gzip)·결과를 고아 브랜치 ci-e2e/<이름> 에 덮어쓴다.
      # main 이 아닌 브랜치 push 때만. 다 보면 브랜치는 지워도 된다(git push origin --delete ci-e2e/<이름>).
      - name: Publish E2E results to ci-e2e branch
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d e2e-out ] || exit 0
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cp -r e2e-out/. /tmp/pub/
          cd /tmp/pub
          [ -f logcat.txt ] && gzip -9 logcat.txt
          if command -v mogrify >/dev/null; then find shots -name '*.png' -exec mogrify -resize '50%' -strip {} + ; fi
          git init -q -b r && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "e2e ${{ matrix.name }} run ${{ github.run_number }} (${{ github.sha }})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-e2e/${{ matrix.name }}

      - name: E2E result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.run1.outcome }}" = "success" ] || [ "${{ steps.run2.outcome }}" = "success" ]; then exit 0; fi
          echo "::error title=e2e (${{ matrix.name }})::종단 시험 실패 — 산출물 e2e-${{ matrix.name }}-${{ github.run_number }} 의 shots/·logcat.txt·instrument/ 를 보세요"
          exit 1
