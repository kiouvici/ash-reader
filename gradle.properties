# SPDX-License-Identifier: AGPL-3.0-or-later
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 측정 앱 빌드에서 엔진 .so ABI 제한(spike 워크플로는 -P로 덮어씀)
ash.abis=arm64-v8a,x86_64
# Maven Central 429·끊김 대비: 내려받기 재시도(기본 3회 → 8회, 처음 2초부터 늘려 가며)
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
