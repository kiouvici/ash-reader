</div>
</div>
<div style="margin-top: 10px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.title}}</div>
<div style="font-size: 11.5px; color: #8E8E93; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.meta}}</div>
<div style="display: inline-flex; align-items: center; height: 20px; margin-top: 5px; padding: 0 7px; border: 1.5px solid {{b.pillC}}; border-radius: 6px; font-size: 11px; font-weight: 700; color: {{b.pillC}}; background: {{b.pillBg}}">{{b.state}}</div>
</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; display: flex; justify-content: center; align-items: flex-start; padding-top: 6px; box-sizing: border-box">
<div style="display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: rgba(255,255,255,0.85); box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.10); backdrop-filter: blur(18px)">
<div style="padding: 6px 18px; border-radius: 10px; background: rgba(0,0,0,0.07); display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111316" stroke-width="2" aria-hidden="true"><path d="M12 6.8C10 5.3 7 4.8 3.5 5.1v12.6c3.5-.3 6.5.2 8.5 1.7 2-1.5 5-2 8.5-1.7V5.1C17 4.8 14 5.3 12 6.8zM12 6.8v12.6"></path></svg>서재</div>
<div style="padding: 6px 18px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: #6C6C70"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path></svg>독서 기록</div>
<div style="padding: 6px 18px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: #6C6C70"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>설정</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 'folder', path: [], from: 0, last: null }; }
renderVals() {
const s = this.state;
const G = (top, bot) => 'linear-gradient(180deg, ' + top + ' 0%, ' + bot + ' 100%)';
const PLAIN = {
'어린 왕자': [G('#1E7BD6', '#0B2D63'), '생텍쥐페리'], '데미안': [G('#B21E1E', '#4A0B0B'), '헤르만 헤세'], '동물농장': [G('#1F8A3A', '#0B3A1A'), '조지 오웰'],
'겨울의 정원': [G('#6B6B6F', '#2A2A2D'), '한소율'], '등대지기': [G('#B4560F', '#4A1D06'), '이도윤'], '별을 엮는 아이': [G('#2457C6', '#0A1E4E'), '윤재이']
};
const ART = {
'코트 위의 여름 1': ['#FF6A13', '#1C1C1C'], '코트 위의 여름 2': ['#F2C230', '#1C1C1C'], '코트 위의 여름 3': ['#16B8E8', '#0C2233']
};
const BAND = { HWP: '#2E6FA8', HWPX: '#2E6FA8', DOCX: '#2B579A', PDF: '#C2343F', TXT: '#9A958C' };
const bk = (title, fmt, pct, when) => {
const p = PLAIN[title], a = ART[title], doc = !p && !a;
const reading = pct && pct < 100;
const state = pct === 100 ? '다 읽음' : reading ? pct + '%' : (when || '새 책');
return {
title, by: p ? p[1] : '', fmt,
bg: p ? p[0] : a ? a[0] : '#FFFFFF', ink: p ? '#FFFFFF' : a ? a[1] : '#26282B', ink2: 'rgba(255,255,255,0.75)',
align: p ? 'center' : 'left', tw: p ? 500 : 900, tTop: doc ? '19px' : p ? '20px' : '16px', clamp: doc ? 3 : p ? 3 : 2,
tsS: doc ? '7.5px' : p ? (title.length > 6 ? '11px' : '12.5px') : '12.5px',
frameShow: p ? 'block' : 'none', byShow: p ? 'block' : 'none',
docShow: doc ? 'block' : 'none', tableShow: fmt === 'HWP' || fmt === 'HWPX' ? 'block' : 'none', band: BAND[fmt] || '#999',
ratio: doc ? '1 / 1.414' : '1 / 1.48',
pct: (pct || 0) + '%', barShow: reading ? 'block' : 'none',
meta: (p ? p[1] + '  ' : '') + fmt,
state, pillC: reading ? '#0A84FF' : '#3A3A3C', pillBg: reading ? 'rgba(10,132,255,0.08)' : 'transparent'
};
};
const DATA = {
folder: [
{ id: 'work', name: '업무', n: 64, recent: [bk('2025 행정업무운영 편람', 'HWP', 42), bk('인사 규정', 'PDF', 65), bk('업무 편람', 'HWP', 10)],
books: [bk('2025 행정업무운영 편람', 'HWP', 42), bk('2025년도 아동양육시설 운영비 보조금 교부 신청서 및 사업계획서', 'HWPX', 0, '어제 받음'), bk('인사 규정', 'PDF', 65), bk('업무 편람', 'HWP', 10), bk('보조금 정산', 'HWPX'), bk('결산 보고', 'PDF', 100)],
kids: [{ id: 'work25', name: '2025', n: 40, books: [bk('2025 행정업무운영 편람', 'HWP', 42), bk('예산서', 'HWPX'), bk('결산 보고', 'PDF', 100), bk('시설 안전 점검표', 'HWPX')] },
{ id: 'rule', name: '규정', n: 24, books: [bk('취업규칙', 'HWP'), bk('복무 규정', 'HWP'), bk('회계 규칙', 'PDF')] }] },
{ id: 'books', name: 'Books', n: 12, recent: [bk('어린 왕자', 'EPUB', 80), bk('등대지기', 'EPUB', 100)],
books: [bk('어린 왕자', 'EPUB', 80), bk('데미안', 'EPUB'), bk('동물농장', 'EPUB'), bk('겨울의 정원', 'EPUB'), bk('등대지기', 'EPUB', 100), bk('별을 엮는 아이', 'EPUB')] },
{ id: 'comics', name: 'Comics', n: 41, recent: [bk('코트 위의 여름 2', 'CBZ', 30)],
books: [bk('코트 위의 여름 1', 'CBZ', 100), bk('코트 위의 여름 2', 'CBZ', 30), bk('코트 위의 여름 3', 'CBZ')],
kids: [{ id: 'court', name: '코트 위의 여름', n: 24, books: [bk('코트 위의 여름 1', 'CBZ', 100), bk('코트 위의 여름 2', 'CBZ', 30), bk('코트 위의 여름 3', 'CBZ')] }] },
{ id: 'dl', name: 'Download', n: 23, recent: [bk('운영 규정 개정안 (2026년 4월 이사회 의결본)', 'HWPX', 20)],
books: [bk('운영 규정 개정안 (2026년 4월 이사회 의결본)', 'HWPX', 20), bk('회의 자료', 'PDF'), bk('신청서 양식', 'DOCX')],
kids: [{ id: 'kakao', name: 'KakaoTalk', n: 9, books: [bk('제천 시내버스 시간표 (2026년 3월 3일 개편)', 'HWP', 100), bk('공문 회신', 'HWP'), bk('견적서', 'PDF')] }] }
],
format: [
{ id: 'epub', name: '이북', n: 38, books: [bk('어린 왕자', 'EPUB', 80), bk('데미안', 'EPUB'), bk('동물농장', 'EPUB'), bk('겨울의 정원', 'EPUB'), bk('등대지기', 'EPUB', 100), bk('별을 엮는 아이', 'EPUB')] },
{ id: 'hwp', name: '한글 문서', n: 31, books: [bk('2025 행정업무운영 편람', 'HWP', 42), bk('2025년도 아동양육시설 운영비 보조금 교부 신청서 및 사업계획서', 'HWPX', 0, '어제 받음'), bk('취업규칙', 'HWP'), bk('제천 시내버스 시간표 (2026년 3월 3일 개편)', 'HWP', 100)] },
{ id: 'pdf', name: 'PDF', n: 24, books: [bk('인사 규정', 'PDF', 65), bk('회의 자료', 'PDF'), bk('결산 보고', 'PDF', 100)] },
{ id: 'comic', name: '만화', n: 41, books: [bk('코트 위의 여름 2', 'CBZ', 30), bk('코트 위의 여름 1', 'CBZ', 100), bk('코트 위의 여름 3', 'CBZ')] }
],
series: [
{ id: 'court', name: '코트 위의 여름', n: 24, books: [bk('코트 위의 여름 1', 'CBZ', 100), bk('코트 위의 여름 2', 'CBZ', 30), bk('코트 위의 여름 3', 'CBZ')] },
{ id: 'lit', name: '세계 문학', n: 7, books: [bk('어린 왕자', 'EPUB', 80), bk('데미안', 'EPUB'), bk('동물농장', 'EPUB')] }
]
};
const list = DATA[s.tab];
const find = (arr, id) => { for (const g of arr) { if (g.id === id) return g; if (g.kids) { const r = find(g.kids, id); if (r) return r; } } return null; };
const cur = s.path.length ? find(list, s.path[s.path.length - 1]) : null;
const shown = cur || (s.last ? find(list, s.last) : null);
const fanOf = (g) => g.books.slice(0, 3).map((b, k) => ({ bg: b.bg, ink: b.ink, title: b.title, align: b.align, tw: b.tw, frameShow: b.frameShow, docShow: b.docShow, bandShow: b.docShow, band: b.band, top: b.docShow === 'block' ? '13px' : '14px', clamp: b.docShow === 'block' ? 3 : 2, ts: b.docShow === 'block' ? '6.5px' : '8.5px', x: (k * 54) + 'px', h: [86, 96, 90][k] + 'px' }));
const groups = list.map((g, gi) => ({
name: g.name, aria: g.name + ', ' + g.n + '권',
sub: (g.kids ? '폴더 ' + g.kids.length + '개  ' : '') + g.n + '권',
fan: fanOf(g), go: () => this.setState({ path: [g.id], from: gi, last: g.id })
}));
const tabs = [['recent', '최근'], ['all', '전체'], ['format', '형식'], ['folder', '폴더'], ['series', '시리즈']].map(([k, l]) => ({
label: l, bg: k === s.tab ? 'rgba(0,0,0,0.08)' : 'transparent', weight: k === s.tab ? 700 : 500,
pick: () => { if (DATA[k]) this.setState({ tab: k, path: [], last: null }); }
}));
const open = !!cur;
const oy = 150 + s.from * 130;
const shelves = [];
if (shown) {
if (shown.recent) shelves.push({ title: '이어 읽기', n: '', chev: 'none', books: shown.recent, go: () => {} });
(shown.kids || []).forEach(k => shelves.push({ title: k.name, n: k.n + '권', chev: 'inline', books: k.books, go: () => this.setState({ path: s.path.concat([k.id]), last: k.id }) }));
}
return {
tabs, groups, heading: { folder: '폴더', format: '형식', series: '시리즈' }[s.tab],
originY: oy + 'px',
listScale: open ? 0.94 : 1, listOp: open ? 0.4 : 1, listBlur: open ? '2px' : '0',
detailScale: open ? 1 : 0.9, detailOp: open ? 1 : 0, detailPE: open ? 'auto' : 'none',
clipTop: open ? '0px' : (oy - 58) + 'px', clipBottom: open ? '0px' : (778 - (oy + 58)) + 'px', clipR: open ? '0px' : '12px', clipSide: open ? '0px' : '16px',
back: () => { const np = s.path.slice(0, -1); this.setState({ path: np, last: np.length ? np[np.length - 1] : s.last }); },
dName: shown ? shown.name : '', dSub: shown ? (shown.kids ? '폴더 ' + shown.kids.length + '개, ' : '') + '책 ' + shown.n + '권' : '',
shelves, allN: shown ? shown.n + '권' : '',
books: shown ? shown.books : []
};
}
}
</script>
