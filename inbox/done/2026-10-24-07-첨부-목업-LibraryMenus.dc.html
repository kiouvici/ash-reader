<svg style="display: {{m.iconShow}}" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>

</div>
</sc-for>
</div>
</div>
</div>

<div style="width: 390px; height: 844px; overflow: hidden; background: #FFFFFF">

<div style="display: {{r.band}}; position: absolute; left: 10px; right: 12px; top: 44px; height: 40px; background-image: repeating-linear-gradient(#DCDCE0 0 1px, transparent 1px 5px)"></div>
</div>

<div style="font-size: 17px; font-weight: 700; line-height: 1.3; word-break: keep-all">{{r.title}}</div>
<div style="font-size: 13.5px; color: #3A3A3C; margin-top: 3px">{{r.by}}</div>

<div style="font-size: 12.5px; line-height: 1.55; color: #8E8E93; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{r.first}}</div>
