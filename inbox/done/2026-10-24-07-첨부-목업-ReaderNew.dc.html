<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>읽기 화면 새 디자인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Noto+Serif+KR:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 2270px; height: 910px; display: flex; gap: 80px; background: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; color: #111316">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="5">
<div style="width: 390px">
<div style="height: 56px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: #6C6C70">{{p.label}}</div>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{p.bg}}; color: {{p.fg}}">

<div style="display: flex; align-items: center; height: 54px; padding: 0 14px 0 24px">
<span style="flex-grow: 1; font-size: 12.5px; color: {{p.sub}}">{{p.top}}</span>
<span style="display: {{p.xShow}}; width: 36px; height: 36px; border-radius: 10px; background: {{p.btnBg}}; box-shadow: {{p.btnShadow}}; text-align: center; line-height: 36px; font-size: 15px">✕</span>
</div>

<div style="padding: 10px 28px 0; font-family: 'Noto Serif KR', serif; font-size: 17px; line-height: 1.85; letter-spacing: -0.01em; word-break: keep-all; opacity: {{p.textOp}}">
<div style="font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700; color: {{p.sub}}; margin-bottom: 14px">2</div>
<sc-for list="{{p.lines}}" as="l" hint-placeholder-count="10">
<div style="opacity: {{l.op}}; background: {{l.hl}}; margin: 0 -10px; padding: 0 10px; border-radius: 4px">{{l.t}}</div>
</sc-for>
</div>

<div style="display: {{p.guideShow}}; position: absolute; left: 0; right: 0; top: 316px; height: 32px">
<div style="position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.3)"></div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; padding: 0 14px">
<span style="display: {{p.chromeShow}}; width: 40px; height: 40px; border-radius: 12px; background: {{p.btnBg}}; box-shadow: {{p.btnShadow}}; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{p.fg}}" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 9h18M3 15h18"></path><path d="M3 12h18" stroke-width="3" opacity="0.35"></path></svg></span>
<span style="flex-grow: 1; text-align: center; font-size: 12.5px; color: {{p.sub}}">{{p.page}}</span>
<span style="display: {{p.chromeShow}}; width: 40px; height: 40px; border-radius: 12px; background: {{p.menuBtnBg}}; box-shadow: {{p.btnShadow}}; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{p.menuBtnFg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"></path></svg></span>
</div>

<div style="display: {{p.stackShow}}; position: absolute; right: 14px; bottom: 76px; width: 250px; flex-direction: column; gap: 8px">
<sc-for list="{{stack}}" as="s" hint-placeholder-count="4">
<div style="display: flex; align-items: center; height: 50px; padding: 0 16px; border-radius: 14px; background: rgba(255,255,255,0.9); backdrop-filter: blur(24px); box-shadow: 0 12px 32px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.05); font-size: 15px; gap: 10px">
<span style="flex-grow: 1">{{s.k}}</span><span style="font-size: 13px; color: #8E8E93">{{s.v}}</span>
<svg style="display: {{s.iShow}}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>
</div>
</sc-for>
<div style="display: flex; gap: 8px">
<sc-for list="{{trio}}" as="t" hint-placeholder-count="3">
<div style="flex: 1; height: 50px; border-radius: 14px; background: rgba(255,255,255,0.9); box-shadow: 0 12px 32px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#111316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="{{t.k}}"><path d="{{t.d}}"></path></svg></div>
</sc-for>
</div>
</div>

<div style="display: {{p.themeShow}}; position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 22px; background: {{p.sheetBg}}; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); padding: 14px 16px 18px; color: {{p.sheetFg}}">
<div style="display: flex; align-items: center; height: 36px"><span style="flex-grow: 1; font-size: 17px; font-weight: 700">테마 및 설정</span><span style="width: 30px; height: 30px; border-radius: 15px; background: {{p.chip}}; text-align: center; line-height: 30px; font-size: 13px">✕</span></div>
<div style="display: flex; gap: 8px; margin-top: 10px">
<div style="flex: 2; height: 46px; border-radius: 12px; background: {{p.chip}}; display: flex; align-items: center"><span style="flex: 1; text-align: center; font-size: 14px">가</span><span style="width: 1px; height: 22px; background: rgba(128,128,128,0.35)"></span><span style="flex: 1; text-align: center; font-size: 21px; font-weight: 700">가</span></div>
<div style="flex: 1; height: 46px; border-radius: 12px; background: {{p.chip}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="쪽 넘김"><path d="M6 3h12v18H6z"></path></svg></div>
<div style="flex: 1; height: 46px; border-radius: 12px; background: {{p.chip}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-label="스크롤"><path d="M6 3v18M18 3v18M10 8h4M10 12h4M10 16h4"></path></svg></div>
<div style="flex: 1; height: 46px; border-radius: 12px; background: {{p.darkChip}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{p.darkFg}}" aria-label="어둡게"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path></svg></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; height: 44px; margin-top: 8px; padding: 0 14px; border-radius: 12px; background: {{p.chip}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle></svg>
<div style="flex-grow: 1; height: 6px; border-radius: 3px; background: rgba(128,128,128,0.3); position: relative"><div style="width: 62%; height: 6px; border-radius: 3px; background: {{p.sheetFg}}"></div><div style="position: absolute; left: 58%; top: -8px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.3)"></div></div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"></path></svg>
</div>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="6">
<div style="height: 84px; border-radius: 14px; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.ring}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-family: {{t.font}}; font-size: 24px; font-weight: {{t.w}}">가가</span><span style="font-size: 12px">{{t.k}}</span>
</div>
</sc-for>
</div>
<div style="height: 44px; margin-top: 10px; border-radius: 12px; background: {{p.chip}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>사용자화 (글꼴·줄 간격·여백·넘김 효과)</div>
</div>

<div style="display: {{p.searchShow}}; position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{p.dim}}"></div>
<div style="display: {{p.searchShow}}; position: absolute; left: 8px; right: 8px; top: 86px; bottom: 8px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); padding: 14px 16px; color: #111316">
<div style="display: flex; align-items: center; gap: 10px">
<div style="flex-grow: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: #EFEFF2"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg><span style="font-size: 15.5px">보아 구렁이</span></div>
<span style="font-size: 15px">닫기</span>
</div>
<div style="font-size: 12.5px; color: #8E8E93; margin: 12px 2px 4px">이 책에서 4곳</div>
<sc-for list="{{finds}}" as="f" hint-placeholder-count="4">
<div style="padding: 12px 2px; border-bottom: 1px solid #E5E5EA">
<div style="display: flex; font-size: 12px; color: #8E8E93"><span style="flex-grow: 1">{{f.ch}}</span><span>{{f.pg}}</span></div>
<div style="font-size: 14px; line-height: 1.55; margin-top: 3px">{{f.pre}}<b style="background: #FFE58A; border-radius: 3px; padding: 0 2px">보아 구렁이</b>{{f.post}}</div>
</div>
</sc-for>
<div style="font-size: 12px; color: #8E8E93; margin-top: 12px">누르면 그 쪽으로 가고, 찾은 곳 위아래로 ‹ › 이동</div>
</div>

</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2270,"height":910}}'>
class Component extends DCLogic {
renderVals() {
const T = ['여섯 살 적에 나는 「체험한 이야기」라는', '제목의, 원시림에 관한 책에서 기막힌', '그림 하나를 본 적이 있다. 맹수를 집어', '삼키고 있는 보아 구렁이 그림이었다.', '그 책에는 이렇게 쓰여 있었다. "보아', '구렁이는 먹이를 씹지도 않고 통째로', '집어삼킨다. 그러고는 꼼짝도 하지 못하고', '여섯 달 동안 잠을 자면서 그것을', '소화시킨다." 나는 그래서 밀림 속에서의', '모험에 대해 한참 생각해 보았다.', '그리고 색연필로 내 생애 첫 번째 그림을', '그려 보았다. 나의 그림 제1호였다.'];
const lines = (guide) => T.map((t, i) => ({ t, op: guide ? (i === 4 ? 1 : 0.28) : 1, hl: guide && i === 4 ? 'rgba(255,214,10,0.28)' : 'transparent' }));
const base = { bg: '#FFFFFF', fg: '#111316', sub: '#8E8E93', btnBg: '#FFFFFF', btnShadow: '0 0 0 1px rgba(0,0,0,0.07), 0 6px 18px rgba(0,0,0,0.08)', menuBtnBg: '#FFFFFF', menuBtnFg: '#111316',
top: '챕터 끝까지 6쪽 남음', page: '4 / 67', xShow: 'block', chromeShow: 'flex', textOp: 1, guideShow: 'none', stackShow: 'none', themeShow: 'none', searchShow: 'none', dim: 'transparent',
sheetBg: '#FFFFFF', sheetFg: '#111316', chip: '#EFEFF2', darkChip: '#EFEFF2', darkFg: '#111316', lines: lines(false) };
const P = [
Object.assign({}, base, { label: '① 읽는 중 — 한 번 누르면 이 상태 (평소엔 쪽수만)' }),
Object.assign({}, base, { label: '② 오른쪽 아래 메뉴 → 떠 있는 메뉴', menuBtnBg: '#111316', menuBtnFg: '#FFFFFF', stackShow: 'flex', textOp: 0.55 }),
Object.assign({}, base, { label: '③ 테마 및 설정 (어둡게 켠 상태)', bg: '#000000', fg: '#E8E8EA', sub: '#8E8E93', btnBg: '#1C1C1E', btnShadow: 'inset 0 0 0 1px rgba(255,255,255,0.08)', menuBtnBg: '#1C1C1E', menuBtnFg: '#E8E8EA', themeShow: 'block', xShow: 'none', chromeShow: 'none', page: '',
sheetBg: '#1C1C1E', sheetFg: '#FFFFFF', chip: '#2C2C2E', darkChip: '#FFFFFF', darkFg: '#000000' }),
Object.assign({}, base, { label: '④ 책 검색', searchShow: 'block', dim: 'rgba(0,0,0,0.25)', chromeShow: 'none', page: '' }),
Object.assign({}, base, { label: '⑤ 안내선 — 읽는 줄만 밝게, 끌어서 이동', guideShow: 'block', lines: lines(true), top: '안내선 · 위아래로 끌기 · 두 번 누르면 끄기' })
];
const tile = (k, bg, fg, font, w, on) => ({ k, bg, fg, font, w, ring: on ? '0 0 0 2.5px #0A84FF' : 'inset 0 0 0 1px rgba(128,128,128,0.25)' });
const serif = "'Noto Serif KR', serif", sans = "'Noto Sans KR', sans-serif";
return {
phones: P,
stack: [
{ k: '목차', v: '4%', d: 'M8 6h12M8 12h12M8 18h12M4 6v.01M4 12v.01M4 18v.01', iShow: 'block' },
{ k: '책 검색', v: '', d: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM16.5 16.5L21 21', iShow: 'block' },
{ k: '테마 및 설정', v: '가가', d: '', iShow: 'none' }
],
trio: [
{ k: '공유', d: 'M12 3v12M8 7l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6' },
{ k: '안내선', d: 'M3 9h18M3 15h18' },
{ k: '책갈피', d: 'M7 3.5h10v17L12 17l-5 3.5z' }
],
themes: [
tile('원본', '#FFFFFF', '#111316', serif, 400, false), tile('고요', '#F4EFE6', '#3B342B', serif, 400, false), tile('종이', '#ECE7DD', '#2B2B2B', serif, 400, false),
tile('볼드', '#FFFFFF', '#000000', sans, 900, false), tile('평온', '#E9EFE9', '#23302A', serif, 400, false), tile('집중', '#000000', '#E8E8EA', sans, 500, true)
],
finds: [
{ ch: '1장', pg: '2쪽', pre: '…맹수를 집어삼키고 있는 ', post: ' 그림이었다.' },
{ ch: '1장', pg: '2쪽', pre: '"', post: '는 먹이를 씹지도 않고…' },
{ ch: '1장', pg: '3쪽', pre: '…코끼리를 소화시키고 있는 ', post: '의 속을…' },
{ ch: '2장', pg: '9쪽', pre: '…나는 그에게 ', post: ' 그림을 보여 주었다.' }
]
};
}
}
</script>
</body>
</html>
