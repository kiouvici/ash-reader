return { title, fmt, bg: n ? n[0] : c ? c[0] : '#F4F4F6', glow: n ? n[1] : c ? 'rgba(242,194,48,0.4)' : 'rgba(255,255,255,0.18)', ink: n ? '#FFFFFF' : c ? c[1] : '#26282B',
frame: n ? 'block' : 'none', band: doc ? 'block' : 'none', bandC: BAND[fmt] || '#999', align: n ? 'center' : 'left', tw: n ? 500 : 900, ts: doc ? '7.5px' : n ? '11px' : '13px',
ratio: doc ? '1 / 1.414' : '1 / 1.48', pct: (pct || 0) + '%', bar: r ? 'block' : 'none',
state: pct === 100 ? '다 읽음' : r ? pct + '%' : '새 책', pillC: r ? '#409CFF' : '#C7C7CC' }; };
const fan = (l) => l.map((b, k) => Object.assign({}, b, { x: (k * 44) + 'px', h: [76, 86][k] + 'px' }));

{ name: '폴더', sub: '4개', fan: fan([bk('회의 자료', 'PDF'), bk('데미안', 'EPUB')]) },
{ name: '시리즈', sub: '3개', fan: fan([bk('코트 위의 여름 1', 'CBZ'), bk('코트 위의 여름 2', 'CBZ')]) }],
recent,
shelf: [bk('2025 행정업무운영 편람', 'HWP', 42), bk('예산서', 'HWPX'), bk('결산 보고', 'PDF', 100), bk('시설 안전 점검표', 'HWPX')],
grid: [bk('업무 편람', 'HWP', 10), bk('인사 규정', 'PDF', 65), bk('어린 왕자', 'EPUB', 80)],

]
